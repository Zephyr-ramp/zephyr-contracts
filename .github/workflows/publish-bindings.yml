name: Publish bindings

# Publishes bindings/ to npm as @zephyr-ramp/escrow-client when a tag like
# `bindings-v0.1.0` is pushed. Requires the NPM_TOKEN repository secret.
on:
  push:
    tags: ["bindings-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: bindings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
